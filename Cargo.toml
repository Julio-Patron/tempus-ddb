[package]
name = "tempus-ddb"
version = "0.5.3"
description = "Fail-closed policy gate for AI agent actions: signed policies, single-use permits, receipts"
license = "MIT"
repository = "https://github.com/Julio-Patron/tempus-ddb"
homepage = "https://julio-patron.github.io/tempus-ddb/"
documentation = "https://julio-patron.github.io/tempus-ddb/docs.html"
authors = ["Tempus DDB Contributors"]
readme = "README.md"
keywords = ["ai-agents", "mcp", "policy", "security", "audit"]
categories = ["cryptography", "authentication", "command-line-utilities"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "_tempus_ddb"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.24", features = ["bundled"] }
rusqlite = { version = "0.31", features = ["bundled"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.89"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
